name: backend-ci

# Backend CI (it does not depend on any client). The integration tests start a real PostgreSQL
# with Testcontainers (Docker comes installed on ubuntu-latest).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - name: Pruebas unitarias y de arquitectura
        run: |
          dotnet test tests/Tahona.BakeryPOS.UnitTests --no-build -c Release
          dotnet test tests/Tahona.BakeryPOS.ArchitectureTests --no-build -c Release
      - name: Integration tests (PostgreSQL in a container)
        run: dotnet test tests/Tahona.BakeryPOS.IntegrationTests --no-build -c Release
      - name: The migration has no pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Tahona.BakeryPOS.Infrastructure --startup-project src/Tahona.BakeryPOS.Infrastructure
      - name: Migrations bundle (artifact for the deployment)
        run: dotnet ef migrations bundle --project src/Tahona.BakeryPOS.Infrastructure --startup-project src/Tahona.BakeryPOS.Infrastructure -o efbundle --self-contained -r linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

  docker:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bakerypos-api:${{ github.sha }} .
      - run: docker build -f Dockerfile.migrations -t bakerypos-migrations:${{ github.sha }} .
      - name: The deployment compose is valid (dummy values, no secrets)
        working-directory: deploy
        env:
          ENVIRONMENT: ci
          ASPNETCORE_ENVIRONMENT: Production
          VERSION: ${{ github.sha }}
          API_DOMAIN: ci.invalid
          CORS_ALLOWED_ORIGIN: https://ci.invalid
          ACME_EMAIL: ci@ci.invalid
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose -f docker-compose.yml config --quiet
