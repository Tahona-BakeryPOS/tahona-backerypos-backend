# Staging and production on a VPS (D-10): PostgreSQL, API, migrations and Caddy (the API's HTTPS proxy) in containers.
# Backend only: no client is built or served from here; each client is deployed on its own.
# One VPS per environment; each with its own .env (not versioned, see .env.example). Usage (docs/runbooks.md):
#   ./scripts/deploy.sh .env.production
# Nothing sensitive in this file: everything comes from the .env.
name: bakerypos-${ENVIRONMENT:?Define ENVIRONMENT (staging or production) in the .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bakerypos
      POSTGRES_USER: bakerypos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # No published port: only the API, the migrations and the backups reach it inside the Docker network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakerypos -d bakerypos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # It runs once per deployment, before the API: docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    image: bakerypos-migrations:${VERSION:?}
    build:
      context: ..
      dockerfile: Dockerfile.migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=bakerypos;Username=bakerypos;Password=${POSTGRES_PASSWORD}

  api:
    image: bakerypos-api:${VERSION:?}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=bakerypos;Username=bakerypos;Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?}
      DataProtection__KeysPath: /keys
      ReverseProxy__Enabled: "true"
      # Origin of the web client that calls the API from the browser (e.g. https://pos.yourbakery.co). More than one: Cors__AllowedOrigins__1, ...
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Define CORS_ALLOWED_ORIGIN (the web client's origin) in the .env}
      Siigo__PartnerId: ${SIIGO_PARTNER_ID:-BakeryPOS}
    volumes:
      - dpkeys:/keys

  # Caddy: automatic HTTPS (Let's Encrypt) and a proxy to the API. It serves no client.
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Define API_DOMAIN (the API's public domain) in the .env}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Fixed names per environment: they survive `docker compose down` (only deleted with `down -v`, never in the runbook).
  pgdata:
    name: bakerypos_${ENVIRONMENT}_pgdata
  # Keys that encrypt the Bold and Siigo credentials: they go in every backup (scripts/backup.sh).
  dpkeys:
    name: bakerypos_${ENVIRONMENT}_dpkeys
  caddy_data:
    name: bakerypos_${ENVIRONMENT}_caddy_data
  caddy_config:
    name: bakerypos_${ENVIRONMENT}_caddy_config
