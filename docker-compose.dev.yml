# Lower environment (local development): Postgres in a container.
# The API is normally run from Visual Studio / dotnet run against this DB;
# to run it in a container too: add `--profile api` and `--build`.
#   docker compose -p bakerypos-dev --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d db
# Port 15432: 5432 is used by the local Windows PostgreSQL and 5433 by the previous system's database.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bakerypos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bakerypos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=bakerypos_dev;Username=postgres;Password=${POSTGRES_PASSWORD}

volumes:
  # Nombre fijo: sobrevive a `docker compose down`.
  # It is only deleted with `down -v` or `docker volume rm bakerypos_dev_pgdata_dev`.
  pgdata:
    name: bakerypos_dev_pgdata_dev
