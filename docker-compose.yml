# Common base. It is not used alone: it is combined with docker-compose.dev.yml.
# Every sensitive value comes from .env.dev (not versioned); no secrets in this file.
# JWT_SECRET: at least 32 characters.
#   docker compose -p bakerypos-dev --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d db
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET}
    ports:
      - "8080:8080"
